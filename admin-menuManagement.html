<!DOCTYPE html>
<html lang="en">

<style>
  @keyframes floatSoft {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }

  .float-soft {
    animation: floatSoft 5s ease-in-out infinite;
  }
</style>

<head>
    <title>CampusBites - Admin Menu Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="assets/icons/1-removebg-preview.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CampusBites">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<style>
  #loading-screen {
  position: fixed;
  inset: 0;
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.spinner {
  width: 55px;
  height: 55px;
  border: 6px solid #ddd;
  border-top: 6px solid #ff7a00;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.blurred {
  filter: blur(6px);
  pointer-events: none;
  user-select: none;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
</style>
<body>
  <section id="loading-screen" aria-live="polite">
  <span class="spinner" aria-hidden="true"></span>
  <p>Loading...</p>
</section>

<main id="site-content" class="blurred">
  <!-- your website content here -->
    <nav class="bg-white border-b border-gray-200 shadow-sm">
      <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
        <a href="index.html" class="flex items-center gap-2">
          <img
            src="assets/icons/1-removebg-preview.png"
            alt="CampusBites logo"
            class="h-12 w-auto object-contain"
            >

            <span class="text-2xl font-extrabold tracking-tight">
                <span class="text-indigo-600">Campus</span><span class="text-orange-500">Bites</span>
            </span>
        </a>

        <section id="navLinks" class="flex items-center gap-6 mx-auto">
          <!-- Populated by navbar.js -->
        </section>

        <section id="profileMenuContainer" class="relative hidden">
          <button id="profileMenuBtn" class="flex items-center gap-2">
            <img
              id="profileAvatar"
              src="assets/default_vendor.jpg"
              alt="Profile"
              class="w-10 h-10 rounded-full object-cover border-2 border-indigo-500"
            />
          </button>

          <section
            id="profileDropdown"
            class="hidden absolute right-0 mt-3 w-56 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50"
          ></section>
        </section>
      </section>
    </nav>
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h2 class="text-2xl font-bold mb-6">Menu Management</h2>
    
    <section class="bg-white/95 backdrop-blur rounded-[2rem] shadow-xl shadow-indigo-100 overflow-hidden border border-indigo-50">
        
        <table class="w-full">
            
            <thead class="bg-indigo-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Vendor</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Menu Items</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Reviews</th>
                </tr>
            </thead>

            <tbody id="vendor-table-body" class="divide-y divide-gray-200">
                <!-- Populated by JS -->
            </tbody>

        </table>
        <section id="details-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm p-4"></section>

      </section>
</main>

    </section>
</main>
    <script src="scripts/pwa.js"></script>
    <script type="module" src="./scripts/navbar.js"></script>
    <script type="module" src="./scripts/admin-menuManagement.js"></script>
    <script>
      lucide.createIcons();
    </script>
</body>
</html>
