<!DOCTYPE html>
<html lang="en">
<head>
    <title>CampusBites - Admin Menu Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CampusBites">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<nav class="bg-white border-b border-gray-200 shadow-sm">
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
    <a href="index.html" class="flex items-center gap-2">
      <i data-lucide="utensils" class="w-7 h-7 text-indigo-600"></i>
      <span class="text-xl font-bold text-gray-900">CampusBites</span>
    </a>

    <section id="navLinks" class="flex items-center gap-6 mx-auto">
      <!-- Populated by navbar.js -->
    </section>

    <section class="flex items-center gap-4">
      <a href="login.html" id="loginLink" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition hidden">
        Sign in
      </a>

      <button id="logoutBtn" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 transition hidden">
        Logout
      </button>
    </section>
  </section>
</nav>
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pt-24">
    <h2 class="text-2xl font-bold mb-6">Menu Management</h2>
    
    <section class="bg-white rounded-xl shadow-sm overflow-hidden">
        
        <table class="w-full">
            
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Vendor</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Menu Items</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Reviews</th>
                </tr>
            </thead>

            <tbody id="vendor-table-body" class="divide-y divide-gray-200">
                <!-- Populated by JS -->
            </tbody>

        </table>
        <section id="details-modal" class="hidden"></section>

    </section>

    </section>
    <script src="scripts/pwa.js"></script>
    <script type="module" src="./scripts/navbar.js"></script>
    <script type="module" src="./scripts/admin-menuManagement.js">
        import { initAuthUI, logout } from "./scripts/auth.js";
    </script>
</body>
</html>
