<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBites - Vendor Order History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/png" href="assets/icons/1-removebg-preview.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusBites">
  <style>
  @keyframes floatSoft {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }

  .float-soft {
    animation: floatSoft 5s ease-in-out infinite;
  }
</style>
</head>

<body class="min-h-screen bg-gradient-to-br from-white via-indigo-50 to-white text-gray-900">

<nav class="bg-white/95 backdrop-blur border-b border-indigo-100 shadow-sm sticky top-0 z-40">
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
    <a href="index.html" class="flex items-center gap-2">
  <img
    src="assets/icons/1-removebg-preview.png"
    alt="CampusBites logo"
    class="h-12 w-auto object-contain"
  >

  <span class="text-2xl font-extrabold tracking-tight">
    <span class="text-indigo-600">Campus</span><span class="text-orange-500">Bites</span>
  </span>
</a>

    <section id="navLinks" class="flex items-center gap-6 mx-auto">
      <!-- Populated by navbar.js -->
    </section>
    <section
      id="profileMenuContainer"
      class="hidden flex items-center gap-4"
    >

      <!-- Notifications -->
      <section class="relative">

        <button
          id="notificationBtn"
          class="relative p-2 rounded-full
                hover:bg-gray-100 transition"
        >
          <i
            data-lucide="bell"
            class="w-5 h-5 text-gray-700"
          ></i>

          <span
            id="notificationBadge"
            class="hidden absolute -top-1 -right-1
                  bg-red-500 text-white text-[10px]
                  font-bold rounded-full
                  min-w-[18px] h-[18px]
                  flex items-center justify-center"
          >
            0
          </span>
        </button>

        <section
          id="notificationDropdown"
          class="hidden absolute right-0 mt-3 w-80
                bg-white rounded-2xl shadow-xl
                border border-gray-100
                max-h-96 overflow-y-auto
                z-50"
        >
        </section>

      </section>

      <!-- Profile -->
      <section class="relative">

        <button
          id="profileMenuBtn"
          class="flex items-center gap-2"
        >
          <img
            id="profileAvatar"
            src="assets/default-icon.png"
            alt="Profile"
            class="w-10 h-10 rounded-full
                  object-cover border-2
                  border-indigo-500"
          />
        </button>

        <section
          id="profileDropdown"
          class="hidden absolute right-0 mt-3 w-56
                bg-white rounded-xl shadow-lg
                border border-gray-100 py-2 z-50"
        ></section>

      </section>

    </section>
  </section>
</nav>
<main class="relative overflow-hidden min-h-[calc(100vh-4rem)]">
  <section class="absolute -left-28 top-32 w-96 h-80 bg-indigo-100 rounded-[45%_55%_60%_40%] opacity-70"></section>
  <section class="absolute -right-20 bottom-6 w-[430px] h-[360px] bg-orange-100 rounded-[55%_45%_40%_60%] opacity-70"></section>
  <section class="absolute right-56 top-24 w-60 h-48 bg-indigo-100 rounded-[45%_55%_60%_40%] opacity-80"></section>

  <span class="absolute left-28 top-40 text-indigo-500 text-5xl font-bold float-soft">+</span>
  <span class="absolute right-80 top-72 text-orange-500 text-4xl font-bold float-soft">✦</span>

  <section class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

  <header class="mb-8 max-w-4xl">
  <p class="text-sm font-semibold text-orange-500 uppercase tracking-wide">Vendor records</p>

  <h1 class="text-5xl md:text-6xl font-extrabold text-indigo-950 leading-tight mt-1">
    Order History
  </h1>

  <p class="mt-4 text-gray-600 leading-relaxed">
    View collected customer orders, search customer names, and filter past order records.
  </p>
</header>

  <!-- Filters -->
  <section class="bg-white/95 backdrop-blur rounded-[2rem] shadow-xl shadow-indigo-100 border border-indigo-50 p-6 mb-8">
    
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <section>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Sort By
        </label>

        <select
          id="SortBy"
          class="w-full border border-gray-300 rounded-xl px-3 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
        >
          <option value="Newest">Newest</option>
          <option value="Oldest">Oldest</option>
          <option value="PriceHighToLow">Revenue High → Low</option>
          <option value="PriceLowToHigh">Revenue Low → High</option>
        </select>
      </section>

      <section>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Order Date
        </label>

        <input
          type="date"
          id="orderDate"
          class="w-full border border-gray-300 rounded-lg px-3 py-2"
        >
      </section>
      <section>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            Search Customer
        </label>

        <input
            type="text"
            id="customerSearch"
            placeholder="Search by customer name..."
            class="w-full border border-gray-300 rounded-lg px-3 py-2"
        >
        </section>

    </section>

  </section>

  <!-- Orders -->
  <section
    id="orderList"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 relative z-10"
  ></section>

  </section>
</main>

<!-- Details Modal -->
<section
  id="order-details-modal"
  class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
>
  <section class="bg-white rounded-[2rem] w-full max-w-4xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl">

    <section class="flex justify-between items-center mb-6">
      <h2
        id="modal-title"
        class="text-2xl font-extrabold text-gray-900"
      >
        Order Details
      </h2>

      <button
        id="closeOrderModal"
        class="text-gray-500 hover:text-gray-700"
      >
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </section>

    <p
      id="numItemsOrder"
      class="text-sm text-gray-500 mb-4"
    ></p>

    <section
      id="itemList"
      class="grid grid-cols-1 md:grid-cols-2 gap-4"
    ></section>

  </section>
</section>

<script type="module" src="scripts/navbar.js"></script>
<script type="module" src="scripts/pwa.js"></script>
<script type="module" src="scripts/vendor-orderHistory.js"></script>
</body>
</html>
