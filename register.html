<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBites - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusBites">
</head>
<body class="min-h-screen bg-white text-slate-900 overflow-x-hidden">

  <section class="relative min-h-screen overflow-hidden bg-gradient-to-br from-white via-indigo-50 to-white">

    <section class="relative z-10 min-h-screen">
      <nav class="bg-white border-b border-gray-200 shadow-sm">
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
          <header class="flex items-center gap-2">
            <img src="assets/icons/1-removebg-preview.png" alt="CampusBites logo" class="h-12 w-auto object-contain">
            <span class="text-2xl font-extrabold tracking-tight">
              <span class="text-indigo-600">Campus</span><span class="text-orange-500">Bites</span>
            </span>
          </header>

          <section class="flex items-center gap-6">
            <a href="index.html" class="text-gray-700 hover:text-indigo-600">Home</a>
            <a href="login.html" class="text-gray-700 hover:text-indigo-600">Login</a>
          </section>
        </section>
      </nav>

      <section class="absolute -left-28 top-32 w-96 h-80 bg-indigo-100 rounded-[45%_55%_60%_40%] opacity-70"></section>
      <section class="absolute -right-20 bottom-6 w-[430px] h-[360px] bg-orange-100 rounded-[55%_45%_40%_60%] opacity-70"></section>
      <section class="absolute right-56 top-24 w-60 h-48 bg-indigo-100 rounded-[45%_55%_60%_40%] opacity-80"></section>
      <section class="absolute left-10 bottom-10 w-72 h-56 bg-orange-100 rounded-[55%_45%_40%_60%] opacity-70 rotate-[-12deg]"></section>

      <span class="absolute left-28 top-40 text-indigo-500 text-5xl font-bold">+</span>
      <span class="absolute left-72 bottom-40 text-indigo-500 text-5xl font-bold">+</span>
      <span class="absolute right-72 bottom-24 text-indigo-500 text-5xl font-bold">+</span>
      <span class="absolute right-80 top-72 text-orange-500 text-4xl font-bold">✦</span>
      <span class="absolute left-[22rem] bottom-64 text-orange-500 text-4xl font-bold">✦</span>

      <i data-lucide="hamburger" class="absolute right-72 top-36 w-24 h-24 text-indigo-600"></i>
      <i data-lucide="coffee" class="absolute right-28 bottom-48 w-24 h-24 text-orange-500"></i>
      <i data-lucide="trending-up" class="absolute left-32 bottom-28 w-24 h-24 text-orange-500"></i>

      <section class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-10">
        <main class="bg-white/95 backdrop-blur w-full max-w-xl rounded-[2rem] shadow-2xl border border-indigo-100 px-10 py-12">
          <header>
            <h1 class="text-4xl font-extrabold text-indigo-950 mb-3 text-center">Create Account</h1>
            <p class="text-lg text-slate-600 text-center mb-8">Join CampusBites and start ordering on campus.</p>
          </header>

          <section aria-labelledby="register-title">
            <h2 id="register-title" class="sr-only">Registration form</h2>

            <form id="registerForm" class="space-y-4">
              <label for="registerName" class="block mb-2 font-semibold text-indigo-950">Full Name</label>
              <section class="relative">
                <i data-lucide="user" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>  
              <input
                type="text"
                id="registerName"
                name="registerName"
                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Enter your full name"
                required
              />
              </section>

              <label for="registerEmail" class="block mb-2 font-semibold text-indigo-950">Email</label>
              <section class="relative">
                <i data-lucide="mail" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
              <input
                type="email"
                id="registerEmail"
                name="registerEmail"
                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Enter your email"
                required
              />
              </section>

              <label for="registerPassword" class="block mb-2 font-semibold text-indigo-950">Password</label>
              <section class="relative">
                <i data-lucide="lock" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
              <input
                type="password"
                id="registerPassword"
                name="registerPassword"
                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Enter your password"
                required
              />
              </section>

              <label for="registerRole" class="block text-sm font-semibold text-indigo-950 mb-2">Role</label>
              <section class="relative">
                <i data-lucide="users" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
              <select
                id="registerRole"
                name="registerRole"
                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                required
              >
                <option value="">Select your role</option>
                <option value="customer">Customer</option>
                <option value="vendor">Vendor</option>
              </select>
              </section>
              
              <section id="shop-name-container" class="hidden">
                <label class="block text-sm font-semibold text-indigo-950 mb-2">
                  Shop Name
                </label>
              <section class="relative">

                <i data-lucide="store" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>

                <input 
                  type="text" 
                  id="shop-name"
                  class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  placeholder="Enter your shop name"
                  required
                />
              </section>
              </section>
              <section id="shop-location-container" class="hidden">
                <label class="block text-sm font-semibold text-indigo-950 mb-2">
                  Shop Location
                </label>
              <section class="relative">
                <i data-lucide="map-pinned" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
                <input 
                  type="text" 
                  id="shop-location"
                  class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  placeholder="Enter your shop location"
                  required
                />
              </section>              
              </section>
              <section id="shop-logo-container" class="hidden">
                <label class="block text-sm font-semibold text-indigo-950 mb-2">
                  Shop Logo
                </label>
              <section class="relative">
                  <section class="flex items-center gap-2 mb-2">
                      <i data-lucide="image" class="h-5 w-5 text-gray-400"></i>
                      <span class="text-sm text-gray-500">Upload your shop logo</span>
                  </section>
                <input type="file" id="logoInput"  accept=".png,.jpg,.jpeg,image/png,image/jpeg" />
              </section>
              </section>
              <section id="bank-name-container" class="hidden">
                <label for="bank-name" class="block text-sm font-semibold text-indigo-950 mb-2">
                  Bank
                </label>
                <section class="relative">
                  <i data-lucide="landmark" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
                  <select
                    id="bank-name"
                    class="w-full pl-10 pr-3 py-3 border border-indigo-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none shadow-sm"
                  >
                    <option value="">Select your bank</option>
                    <option value="absa">ABSA</option>
                    <option value="capitec">Capitec</option>
                    <option value="discovery">Discovery Bank</option>
                    <option value="fnb">FNB</option>
                    <option value="investec">Investec</option>
                    <option value="nedbank">Nedbank</option>
                    <option value="standard_bank">Standard Bank</option>
                    <option value="tymebank">TymeBank</option>
                    <option value="african_bank">African Bank</option>
                    <option value="bidvest">Bidvest Bank</option>
                  </select>
                </section>
              </section>
              <section id="account-holder-container" class="hidden">
                <label for="account-holder" class="block text-sm font-medium text-gray-700 mb-1">
                  Account Holder Name
                </label>
                <section class="relative">
                  <i data-lucide="user-round" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
                  <input
                    type="text"
                    id="account-holder"
                    class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Name as it appears on the account"
                  />
                </section>
              </section>
              <section id="account-number-container" class="hidden">
                <label for="account-number" class="block text-sm font-medium text-gray-700 mb-1">
                  Account Number
                </label>
                <section class="relative">
                  <i data-lucide="credit-card" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
                  <input
                    type="text"
                    id="account-number"
                    inputmode="numeric"
                    pattern="[0-9]{10}"
                    autocomplete="off"
                    class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="10 digits"
                  />
                </section>
              </section>
              <section id="branch-code-container" class="hidden">
                <label for="branch-code" class="block text-sm font-medium text-gray-700 mb-1">
                  Universal Branch Code
                </label>
                <section class="relative">
                  <i data-lucide="hash" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
                  <input
                    type="text"
                    id="branch-code"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="6-digit branch code"
                  />
                </section>
              </section>
              <section id="account-type-container" class="hidden">
                <label for="account-type" class="block text-sm font-medium text-gray-700 mb-1">
                  Account Type
                </label>
                <section class="relative">
                  <i data-lucide="wallet" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
                  <select
                    id="account-type"
                    class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
                  >
                    <option value="">Select account type</option>
                    <option value="cheque">Cheque / Current</option>
                    <option value="savings">Savings</option>
                    <option value="transmission">Transmission</option>
                  </select>
                </section>
              </section>
              <button
                type="submit"
                class="w-full mt-4 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition"
              >
                Create Account
              </button>
               <section class="flex items-center my-4" aria-label="Alternative sign in options">
                <hr class="flex-grow border-gray-300" />
                <span class="mx-3 text-sm text-gray-500">or continue with</span>
                <hr class="flex-grow border-gray-300" />
              </section>
              <section class="grid grid-cols-3 gap-3">
              <button
                type="button" id="googleRegister"
                class="border border-indigo-100 rounded-2xl p-4 hover:bg-indigo-50 transition space-y-2 shadow-sm">
              <img src="https://www.google.com/favicon.ico" class="w-5 h-5 mx-auto" alt="Google">
              <span class="block text-sm">Google</span>
              </button>
              <button
                type="button" id="facebookRegister"
                class="border border-indigo-100 rounded-2xl p-4 hover:bg-indigo-50 transition space-y-2 shadow-sm">
              <svg class="w-5 h-5 mx-auto" fill="#1877F2" viewBox="0 0 24 24">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              <span class="block text-sm">Facebook</span>
              </button>
              <button type="button" id="microsoftRegister"
                  class="border border-indigo-100 rounded-2xl p-4 hover:bg-indigo-50 transition space-y-2 shadow-sm">
                  <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg"
                  class="w-5 h-5 mx-auto">
                  <span class="block text-sm">Microsoft</span>
              </button>
              </section>
              <section class="mt-3 grid grid-cols-2 gap-3">
              </section>
            </form>
          </section>

          <footer>
            <p class="text-indigo-600 font-semibold hover:text-orange-500 transition">
              Already have an account?
              <a href="login.html" class="text-indigo-600 font-semibold hover:underline">
                Login
              </a>
            </p>
          </footer>
        </main>
      </section>
    </section>
  </section>
  <script src="scripts/pwa.js"></script>

  <script type="module" src="scripts/register.js"></script>
  <script type="module">
  import { initAuthUI} from "./scripts/auth.js";

  initAuthUI();
  lucide.createIcons();
</script>
</body>
</html>
