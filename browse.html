<!DOCTYPE html>
<html lang="en">
<head>
  <title>CampusBites - Browse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusBites">
</head>
<style>
  #toast-container article {
  animation: toast-slide-in 0.25s ease;
}
  @keyframes toast-slide-in {
  from {
    opacity: 0;
    transform: translateX(40px);
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.animate-slide-in {
  animation: slide-in 0.3s ease;
}
</style>

<body class="bg-gray-100">

<nav class="bg-white border-b border-gray-200 shadow-sm">
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
    <a href="index.html" class="flex items-center gap-2">
      <img
        src="assets/icons/1-removebg-preview.png"
        alt="CampusBites logo"
        class="h-12 w-auto object-contain"
        >

        <span class="text-2xl font-extrabold tracking-tight">
            <span class="text-indigo-600">Campus</span><span class="text-orange-500">Bites</span>
        </span>
    </a>

    <section id="navLinks" class="flex items-center gap-6 mx-auto">
      <!-- Populated by navbar.js -->
    </section>

    <section id="profileMenuContainer" class="relative hidden">
        <button id="profileMenuBtn" class="flex items-center gap-2">
            <img
            id="profileAvatar"
             src="assets/default-icon.png"
            alt="Profile"
            class="w-10 h-10 rounded-full object-cover border-2 border-indigo-500"
            />
        </button>

        <section
            id="profileDropdown"
            class="hidden absolute right-0 mt-3 w-56 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50"
        ></section>
        </section>
  </section>
</nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-8">

    <section class="flex flex-col md:flex-row gap-6">

      <aside class="w-full md:w-64 space-y-6">

        <section class="bg-white p-4 rounded-xl shadow-sm">

          <h3 class="font-semibold mb-4 flex items-center gap-2">
            <i data-lucide="filter" class="w-4 h-4"></i>
            Filters
          </h3>

          <section class="mb-4">
            <label class="text-sm font-medium text-gray-700 mb-2 block">Vendor</label>
            <select id="Vendors" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="AllVendors" selected>All Vendors</option>
            </select>
          </section>
          <section class="mb-4">
            <label class="text-sm font-medium text-gray-700 mb-2 block">Vendor's Location</label>
            <select id="VendorLocations" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="AllLocations" selected>All Locations</option>
            </select>
          </section>
          <section class="mb-4">
            <label class="text-sm font-medium text-gray-700 mb-2 block">Sort by</label>
            <select id="SortBy" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="Default" selected>Default</option>
              <option value="PriceLowToHigh">Price: Low to High</option>
              <option value="PriceHighToLow">Price: High to Low</option>
              <option value="VendorNameAtoZ">Vendor Name: A to Z</option>
              <option value="VendorNameZtoA">Vendor Name: Z to A</option>
              <option value="Rating">Rating</option>
            </select>
          </section>

          <section class="mb-4">
            <label class="text-sm font-medium text-gray-700 mb-2 block">Category</label>
            <select id="Categories" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="AllCategories" selected>All Categories</option>
              <option value="Light Meals">Light Meals</option>
              <option value="Main Course">Main Course</option>
              <option value="Beverages">Beverages</option>
              <option value="Healthy">Healthy</option>
              <option value="Desserts">Desserts</option>
            </select>
          </section>

          <section class="mb-4">
            <label class="text-sm font-medium text-gray-700 mb-2 block">Dietary</label>

            <section class="space-y-2">
              <label class="flex items-center gap-2 text-sm">
                <input id="Vegan" type="checkbox" class="rounded text-green-600">
                Vegan
              </label>

              <label class="flex items-center gap-2 text-sm">
                <input id="Vegetarian" type="checkbox" class="rounded text-green-600">
                Vegetarian
              </label>

              <label class="flex items-center gap-2 text-sm">
                <input id="Gluten-Free" type="checkbox" class="rounded text-green-600">
                Gluten-Free
              </label>

              <label class="flex items-center gap-2 text-sm">
                <input id="Halal" type="checkbox" class="rounded text-green-600">
                Halal
              </label>
            </section>
          </section>
          <!-- Price Filter-->
                     <section id = "PriceFilter">
                        <label id = "PriceLabel" class="text-sm font-medium text-gray-700 mb-2 block">
                            Max Price: R200
                        </label>
                        <input id = "PriceSlider" type="range" min="0" max="200" value="200" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                     </section>
          <section class="bg-indigo-50 p-4 rounded-xl mt-4">
            <h4 class="text-sm font-semibold text-indigo-900 mb-2">Allergen Information</h4>
            <p class="text-xs text-indigo-700">
              All menu items comply with SA Regulation R.146 of 2010 regarding allergen declaration.
            </p>
          </section>

        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm">
          <section class="flex items-center gap-3">
            <button id="cart" class="relative bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition flex items-center gap-2">
              <i data-lucide="shopping-cart" class="w-5 h-5"></i>
              View Cart

              <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center">
                0
              </span>
            </button>
          </section>
        </section>

      </aside>

      <section class="flex-1">
        <header class="mb-6 flex justify-between items-center">
          <h2 class="text-4xl font-bold text-indigo-950">Browse Menu</h2>
          <p id="numItems" class="text-sm text-gray-500">0 items found</p>
        </header>

        <section id="menu" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></section>
      </section>

    </section>

    <section id="item-edit-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
      <article class="bg-white rounded-2xl max-w-5xl w-full max-h-[90vh] overflow-y-auto p-6">

        <header class="flex justify-center">
          <h3 class="text-xl font-bold mb-4">Items in Cart</h3>
        </header>

        <section id="cartList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></section>

        <p id="cartWarning" class="hidden text-sm text-red-500 mt-3">
          Your cart is empty.
        </p>

        <p id="numItemsCart" class="text-sm text-gray-500 mt-3">
          0 items in cart
        </p>

        <fieldset id="paymentMethodSelect" class="mt-4 border border-gray-200 rounded-lg p-3">
          <legend class="text-sm font-semibold text-gray-700 px-1">Payment method</legend>
          <label class="flex items-center gap-2 text-sm py-1">
            <input type="radio" name="paymentMethod" value="card" checked />
            Pay with card (Paystack)
          </label>
          <label class="flex items-center gap-2 text-sm py-1">
            <input type="radio" name="paymentMethod" value="cash" />
            Pay with cash on collection
          </label>
        </fieldset>

        <section class="flex gap-3 mt-6">
          <button type="button" id="closeCartModal" class="flex-1 border border-gray-300 py-2 rounded-lg hover:bg-gray-50">
            Close
          </button>
          <button type="button" id="empty" class="flex-1 border border-gray-300 py-2 rounded-lg hover:bg-gray-50">
            Empty Cart
          </button>
          <button id="checkOut" class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
            Check Out
          </button>
        </section>

      </article>
    </section>

  </main>
    <section id="details-modal" class="hidden"></section>

    <script src="scripts/pwa.js"></script>
    <script type="module" src="./scripts/navbar.js"></script>

  <script type="module">
    import { initAuthUI, logout } from "./scripts/auth.js";

    initAuthUI();
    lucide.createIcons();

    document.getElementById("logoutBtn")?.addEventListener("click", logout);
  </script>

  <script type="module" src="./scripts/browse.js"></script>

</body>
</html>
