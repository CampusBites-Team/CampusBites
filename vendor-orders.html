<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/png" href="assets/icons/1-removebg-preview.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusBites">
</head>

<body>
 <nav class="bg-white border-b border-gray-200 shadow-sm">
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
    <a href="index.html" class="flex items-center gap-2">
      <img
        src="assets/icons/1-removebg-preview.png"
        alt="CampusBites logo"
        class="h-12 w-auto object-contain"
        >

        <span class="text-2xl font-extrabold tracking-tight">
            <span class="text-indigo-600">Campus</span><span class="text-orange-500">Bites</span>
        </span>
    </a>

    <section id="navLinks" class="flex items-center gap-6 mx-auto">
      <!-- Populated by navbar.js -->
    </section>
        <section id="profileMenuContainer" class="relative hidden">
        <button id="profileMenuBtn" class="flex items-center gap-2">
            <img
            id="profileAvatar"
             src="assets/default-icon.png"
            alt="Profile"
            class="w-10 h-10 rounded-full object-cover border-2 border-indigo-500"
            />
        </button>

        <section
            id="profileDropdown"
            class="hidden absolute right-0 mt-3 w-56 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50"
        ></section>
        </section>
  </section>
</nav>

  <main class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <header class="flex justify-between items-center mb-8">
      <section>
        <h2 class="text-2xl font-bold">Order Management</h2>
        <p class="text-gray-600">Drag orders forward through the workflow.</p>
      </section>
    </header>

    <section class="py-12 bg-gray-50 rounded-2xl shadow">
      <section class="max-w-full mx-auto px-4">

        <header class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-8">
          <article class="bg-white p-6 rounded-2xl shadow">
            <i data-lucide="rocket" class="w-8 h-8 text-blue-500 mb-4"></i>
            <h3 class="text-xl font-semibold mb-2">Pending</h3>
            <p class="text-gray-600">Newly placed orders start here.</p>
          </article>

          <article class="bg-white p-6 rounded-2xl shadow">
            <i data-lucide="shield" class="w-8 h-8 text-green-500 mb-4"></i>
            <h3 class="text-xl font-semibold mb-2">Preparing</h3>
            <p class="text-gray-600">Drag Pending orders here when preparation starts.</p>
          </article>

          <article class="bg-white p-6 rounded-2xl shadow">
            <i data-lucide="badge-check" class="w-8 h-8 text-yellow-500 mb-4"></i>
            <h3 class="text-xl font-semibold mb-2">Ready</h3>
            <p class="text-gray-600">Drag Preparing orders here when ready for collection.</p>
          </article>

          <article class="bg-white p-6 rounded-2xl shadow">
            <i data-lucide="users" class="w-8 h-8 text-purple-500 mb-4"></i>
            <h3 class="text-xl font-semibold mb-2">Collected</h3>
            <p class="text-gray-600">Drag Ready orders here once collected.</p>
          </article>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-8 mt-2">
          <section id="newOrders" aria-label="Pending orders" class="bg-white p-6 rounded-2xl shadow min-h-64">
            <i data-lucide="rocket" class="w-8 h-8 text-blue-500 mb-4"></i>
          </section>

          <section id="preparingOrders" aria-label="Preparing orders" class="bg-white p-6 rounded-2xl shadow min-h-64">
            <i data-lucide="shield" class="w-8 h-8 text-green-500 mb-4"></i>
          </section>

          <section id="readyOrders" aria-label="Ready orders" class="bg-white p-6 rounded-2xl shadow min-h-64">
            <i data-lucide="badge-check" class="w-8 h-8 text-yellow-500 mb-4"></i>
          </section>

          <section id="completedOrders" aria-label="Collected orders" class="bg-white p-6 rounded-2xl shadow min-h-64">
            <i data-lucide="users" class="w-8 h-8 text-purple-500 mb-4"></i>
          </section>
        </section>

      </section>
    </section>
  </main>
  <script src="scripts/pwa.js"></script>
  <script type="module" src="./scripts/navbar.js"></script>

  <script type="module" src="scripts/orders.js"></script>
</body>
</html>
