<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> CampusBites - Login </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/png" href="assets/icons/1-removebg-preview.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusBites">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body class="min-h-screen bg-white text-slate-900 overflow-x-hidden">

  <section class="relative min-h-screen overflow-hidden bg-gradient-to-br from-white via-indigo-50 to-white">

    <section class="relative z-10 min-h-screen">
      <nav class="bg-white border-b border-gray-200 shadow-sm">
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
          <header class="flex items-center gap-2">
            <img src="assets/icons/1-removebg-preview.png" alt="CampusBites logo" class="h-12 w-auto object-contain">
              <span class="text-2xl font-extrabold tracking-tight">
                <span class="text-indigo-600">Campus</span><span class="text-orange-500">Bites</span>
              </span>
          </header>

          <section class="flex items-center gap-6">
            <a href="index.html" class="text-gray-700 hover:text-indigo-600">Home</a>
            <a href="register.html" class="text-gray-700 hover:text-indigo-600">Register</a>
          </section>
        </section>
      </nav>

      <section class="absolute -left-28 top-32 w-96 h-80 bg-indigo-100 rounded-[45%_55%_60%_40%] opacity-70"></section>
      <section class="absolute -right-20 bottom-6 w-[430px] h-[360px] bg-orange-100 rounded-[55%_45%_40%_60%] opacity-70"></section>
      <section class="absolute right-56 top-24 w-60 h-48 bg-indigo-100 rounded-[45%_55%_60%_40%] opacity-80"></section>
      <section class="absolute left-10 bottom-10 w-72 h-56 bg-orange-100 rounded-[55%_45%_40%_60%] opacity-70 rotate-[-12deg]"></section>

      <span class="absolute left-28 top-40 text-indigo-500 text-5xl font-bold">+</span>
      <span class="absolute left-72 bottom-40 text-indigo-500 text-5xl font-bold">+</span>
      <span class="absolute right-72 bottom-24 text-indigo-500 text-5xl font-bold">+</span>
      <span class="absolute right-80 top-72 text-orange-500 text-4xl font-bold">✦</span>
      <span class="absolute left-[22rem] bottom-64 text-orange-500 text-4xl font-bold">✦</span>

      <i data-lucide="hamburger" class="absolute right-72 top-36 w-24 h-24 text-indigo-600"></i>
      <i data-lucide="coffee" class="absolute right-28 bottom-48 w-24 h-24 text-orange-500"></i>
      <i data-lucide="trending-up" class="absolute left-32 bottom-28 w-24 h-24 text-orange-500"></i>

      <section class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-10">
        <main class="bg-white/95 backdrop-blur w-full max-w-xl rounded-[2rem] shadow-2xl border border-indigo-100 px-10 py-12">
          <header>
            <h1 class="text-3xl font-extrabold mb-2 text-center text-indigo-950">Welcome!</h1>
            <p class="text-center text-slate-600 mb-6">Sign in to continue ordering on campus.</p>
          </header>

          <section aria-labelledby="login-title">
            <h2 id="login-title" class="sr-only">Login form</h2>

            <form id="loginForm" class="space-y-4">
              <label for="loginEmail" class="block mb-2 font-semibold text-indigo-950">Email</label>
              <section class="relative">
                <i data-lucide="mail" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
              <input
                type="email"
                id="loginEmail"
                name="email"
                class="w-full pl-10 pr-3 py-3 border border-indigo-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none shadow-sm"
                placeholder="Enter your email"
                required
              />
              </section>
              <label for="loginPassword" class="block mb-2 font-semibold text-indigo-950">Password</label>

              <section class="relative">
              <i data-lucide="lock" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
              <input
                type="password"
                id="loginPassword"
                name="password"
                class="w-full pl-10 pr-10 py-3 border border-indigo-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none shadow-sm"
                placeholder="Enter your password"
                required
              />

              <button
                type="button"
                id="toggleLoginPassword"
                class="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
                aria-label="Toggle password visibility"
              >
                <i data-lucide="eye" class="h-5 w-5"></i>
              </button>
              </section>

              <section class="text-right">
                <a href="forgot-password.html" class="text-sm text-indigo-600 hover:underline">
                  Forgot Password?
                </a>
            </section>

              <button
                type="submit"
                class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold hover:bg-indigo-700 transition shadow-xl shadow-indigo-200"
              >
                Sign In
              </button>

              <section class="flex items-center my-4" aria-label="Alternative sign in options">
                <hr class="flex-grow border-gray-300" />
                <span class="mx-3 text-sm text-gray-500">or continue with</span>
                <hr class="flex-grow border-gray-300" />
              </section>
<section class="space-y-3">
              <button
                type="button" id="googleLogin"
                class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 rounded-xl py-3 px-4 transition shadow-sm text-[#1f1f1f]"
                style="font-family: 'Roboto', sans-serif; font-weight: 500;">
                <img src="assets/icons/oauth/google.svg" class="w-5 h-5" alt="">
                <span>Continue with Google</span>
              </button>
              <button
                type="button" id="microsoftLogin"
                class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 rounded-xl py-3 px-4 transition shadow-sm text-[#5e5e5e] font-medium"
                style="font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
                <img src="assets/icons/oauth/microsoft.svg" class="w-5 h-5" alt="">
                <span>Continue with Microsoft</span>
              </button>
              <button
                type="button" id="facebookLogin"
                class="w-full flex items-center justify-center gap-3 bg-[#1877F2] hover:bg-[#0d65d9] rounded-xl py-3 px-4 transition shadow-sm text-white font-medium"
                style="font-family: system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;">
                <svg class="w-5 h-5" fill="white" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                <span>Continue with Facebook</span>
              </button>
            </section>

            </form>
          </section>

          <footer>
            <p class="mt-6 text-center text-sm text-slate-600">
              No account?
              <a href="register.html" class="text-indigo-600 font-semibold hover:underline">
                Register
              </a>
            </p>
          </footer>
        </main>
      </section>
    </section>
  </section>
<script src="scripts/pwa.js"></script>
<script type="module">
  import { initLoginPage } from "./scripts/login.js";

  initLoginPage();
</script>
<script type="module">
  import { initAuthUI} from "./scripts/auth.js";

  initAuthUI();
  lucide.createIcons();
</script>
</body>
</html>
