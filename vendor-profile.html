<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBites - Vendor Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusBites">
</head>

<body class="min-h-screen bg-gray-100">

<nav class="bg-white border-b border-gray-200 shadow-sm">
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
    <a href="index.html" class="flex items-center gap-2">
      <i data-lucide="utensils" class="w-7 h-7 text-indigo-600"></i>
      <span class="text-xl font-bold text-gray-900">CampusBites</span>
    </a>

    <section id="navLinks" class="flex items-center gap-6 mx-auto">
      <!-- Populated by navbar.js -->
    </section>
        <section id="profileMenuContainer" class="relative hidden">
        <button id="profileMenuBtn" class="flex items-center gap-2">
            <img
            id="profileAvatar"
             src="assets/default-icon.png"
            alt="Profile"
            class="w-10 h-10 rounded-full object-cover border-2 border-indigo-500"
            />
        </button>

        <section
            id="profileDropdown"
            class="hidden absolute right-0 mt-3 w-56 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50"
        ></section>
        </section>
  </section>
</nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <section class="bg-white rounded-2xl shadow-md p-6 mb-8">
      <section class="flex flex-col md:flex-row gap-6 items-center md:items-start">

        <section
          id="vendorImageFallback"
          class="w-32 h-32 rounded-full border border-gray-200 bg-gray-100 flex items-center justify-center"
        >
          <i data-lucide="store" class="w-14 h-14 text-gray-400"></i>
        </section>

        <img
          id="vendorImage"
          src=""
          alt="Vendor logo"
          class="hidden w-32 h-32 rounded-full object-cover border border-gray-200 bg-gray-100"
        />

        <section class="flex-1 text-center md:text-left">
          <h1 id="vendorName" class="text-3xl md:text-4xl font-bold text-gray-900">
            Vendor Name
          </h1>

          <p id="vendorLocation" class="mt-2 text-gray-600">
            Vendor location
          </p>

          <section class="mt-4 flex flex-wrap justify-center md:justify-start gap-3">
            <span id="vendorStatus" class="px-3 py-1 rounded-full text-sm font-semibold bg-gray-100 text-gray-700">
              Loading status
            </span>

            <span id="vendorHours" class="px-3 py-1 rounded-full text-sm bg-indigo-50 text-indigo-700">
              Loading hours
            </span>
          </section>
        </section>

      </section>
    </section>

    <section class="mb-8">
      <header class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900">
          Vendor Menu
        </h2>
        <p class="text-gray-600">
          View available items from this vendor.
        </p>
      </header>

      <section id="vendorMenu" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <p class="text-gray-500">Loading menu items...</p>
      </section>
    </section>
    <section class="mt-10">
  <h2 class="text-2xl font-bold text-gray-900 mb-4">Reviews</h2>
  <section id="vendorReviews" class="space-y-4"></section>
</section>

  </main>
<script src="scripts/pwa.js"></script>
  <script type="module">
    import { initAuthUI, logout } from "./scripts/auth.js";

    initAuthUI();
    lucide.createIcons();

    document.getElementById("logoutBtn")?.addEventListener("click", logout);
  </script>

  <script type="module" src="./scripts/vendor-profile.js"></script>
  <script type="module" src="./scripts/navbar.js"></script>

</body>
</html>
