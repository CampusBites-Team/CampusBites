<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBites - Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampusBites">
</head>

<style>
  @keyframes floatSoft {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }

  .float-soft {
    animation: floatSoft 5s ease-in-out infinite;
  }
</style>

<body class="min-h-screen bg-white text-slate-900 overflow-x-hidden">

  <section class="relative min-h-screen overflow-hidden bg-gradient-to-br from-white via-indigo-50 to-white">

  <section class="absolute -left-28 top-32 w-96 h-80 bg-indigo-100 rounded-[45%_55%_60%_40%] opacity-70"></section>
  <section class="absolute -right-16 bottom-8 w-[380px] h-[320px] bg-orange-100 rounded-[55%_45%_40%_60%] opacity-65"></section>
  <section class="absolute right-56 top-24 w-60 h-48 bg-indigo-100 rounded-[45%_55%_60%_40%] opacity-80"></section>
  <section class="absolute left-10 bottom-10 w-72 h-56 bg-orange-100 rounded-[55%_45%_40%_60%] opacity-70 rotate-[-12deg]"></section>

  <span class="absolute left-28 top-40 text-indigo-500 text-5xl font-bold float-soft">+</span>
  <span class="absolute left-72 bottom-40 text-indigo-500 text-5xl font-bold float-soft">+</span>
  <span class="absolute right-72 bottom-24 text-indigo-500 text-5xl font-bold float-soft">+</span>
  <span class="absolute right-80 top-72 text-orange-500 text-4xl font-bold float-soft">✦</span>
  <span class="absolute left-[22rem] bottom-64 text-orange-500 text-4xl font-bold float-soft">✦</span>

  <i data-lucide="mail" class="absolute right-72 top-36 w-24 h-24 text-indigo-600 float-soft"></i>
  <i data-lucide="lock-keyhole" class="absolute right-36 bottom-52 w-20 h-20 text-orange-500 float-soft"></i>
  <i data-lucide="utensils-crossed" class="absolute left-32 bottom-28 w-24 h-24 text-orange-500 float-soft"></i>

    <section class="relative z-10 min-h-screen">
      <nav class="bg-white border-b border-gray-200 shadow-sm">
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
          <header class="flex items-center gap-2">
            <img
              src="assets/icons/1-removebg-preview.png"
              alt="CampusBites logo"
              class="h-12 w-auto object-contain"
            >
            <span class="text-2xl font-extrabold tracking-tight">
              <span class="text-indigo-600">Campus</span><span class="text-orange-500">Bites</span>
            </span>
          </header>

          <section class="flex items-center gap-6">
            <a href="index.html" class="text-gray-700 hover:text-indigo-600">Home</a>
            <a href="login.html" class="text-gray-700 hover:text-indigo-600">Login</a>
          </section>
        </section>
      </nav>

      <section class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-10">
        <main class="bg-white/95 backdrop-blur w-full max-w-md rounded-[2rem] shadow-2xl border border-indigo-100 px-8 py-10">
          <header>
            <h1 class="text-3xl font-extrabold mb-2 text-center text-indigo-950">Forgot Password</h1>
              <p class="text-center text-slate-600 mb-6">
                Enter your email and we’ll send you a password reset link.
              </p>
          </header>

          <section aria-labelledby="forgot-password-title">
            <h2 id="forgot-password-title" class="sr-only">Forgot password form</h2>

            <form id="forgotPasswordForm" class="space-y-4">
              <label for="resetEmail" class="block mb-2 font-semibold text-indigo-950">Email</label>
              <section class="relative">
                <i data-lucide="mail" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>
                <input
                  type="email"
                  id="resetEmail"
                  name="email"
                  class="w-full pl-10 pr-3 py-3 border border-indigo-100 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none shadow-sm"
                  placeholder="Enter your email"
                  required
                />
              </section>

              <button
                type="submit"
                class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold hover:bg-indigo-700 transition shadow-xl shadow-indigo-200"
              >
                Send Reset Link
              </button>
            </form>
          </section>

          <footer>
            <p class="mt-6 text-center text-sm text-slate-600">
              <a href="login.html" class="text-indigo-600 font-semibold hover:underline">
                Back to Login
              </a>
            </p>
          </footer>
        </main>
      </section>
    </section>
  </section>
  <script src="scripts/pwa.js"></script>

  <script type="module" src="scripts/forgot-password.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
