<!DOCTYPE html>
<html lang="en">
<head>
    <title>CampusBites - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CampusBites">
    <style>
  @keyframes floatSoft {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }

  .float-soft {
    animation: floatSoft 5s ease-in-out infinite;
  }

  .admin-action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    min-width: 110px;
    padding: 0.65rem 1rem;
    border-radius: 1rem;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .admin-approve-btn {
    background: #ecfdf5;
    color: #15803d;
    border: 1px solid #bbf7d0;
  }

  .admin-reject-btn {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
  }

  .admin-suspend-btn {
    background: #fff7ed;
    color: #ea580c;
    border: 1px solid #fed7aa;
  }

  .admin-action-btn svg {
    width: 1rem;
    height: 1rem;
    flex-shrink: 0;
  }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-white via-indigo-50 to-white text-gray-900">
<nav class="bg-white/95 backdrop-blur border-b border-indigo-100 shadow-sm sticky top-0 z-40">
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
    <a href="index.html" class="flex items-center gap-2">
      <img
        src="assets/icons/1-removebg-preview.png"
        alt="CampusBites logo"
        class="h-12 w-auto object-contain"
        >

        <span class="text-2xl font-extrabold tracking-tight">
            <span class="text-indigo-600">Campus</span><span class="text-orange-500">Bites</span>
        </span>
    </a>

    <section id="navLinks" class="flex items-center gap-6 mx-auto">
      <!-- Populated by navbar.js -->
    </section>

        <section id="profileMenuContainer" class="relative hidden">
        <button id="profileMenuBtn" class="flex items-center gap-2">
            <img
            id="profileAvatar"
             src="assets/default-icon.png"
            alt="Profile"
            class="w-10 h-10 rounded-full object-cover border-2 border-indigo-500"
            />
        </button>

        <section
            id="profileDropdown"
            class="hidden absolute right-0 mt-3 w-56 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50"
        ></section>
        </section>
  </section>
</nav>
    <main class="relative overflow-hidden min-h-[calc(100vh-4rem)]">
  <section class="absolute -left-28 top-32 w-96 h-80 bg-indigo-100 rounded-[45%_55%_60%_40%] opacity-70"></section>
  <section class="absolute -right-20 bottom-6 w-[430px] h-[360px] bg-orange-100 rounded-[55%_45%_40%_60%] opacity-70"></section>
  <section class="absolute right-56 top-24 w-60 h-48 bg-indigo-100 rounded-[45%_55%_60%_40%] opacity-80"></section>

  <span class="absolute left-28 top-40 text-indigo-500 text-5xl font-bold float-soft">+</span>
  <span class="absolute right-80 top-72 text-orange-500 text-4xl font-bold float-soft">✦</span>

  <section class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <header class="mb-8 max-w-4xl">
  <p class="text-sm font-semibold text-orange-500 uppercase tracking-wide">Admin tools</p>
  <h2 class="text-4xl font-extrabold text-gray-900 mt-1">Vendor Management</h2>
  <p class="mt-3 text-gray-600 leading-relaxed">
    Review vendors, approval status, contact details, locations, and admin actions from one dashboard.
  </p>
</header>
    
    <section class="bg-white/95 backdrop-blur rounded-[2rem] shadow-xl shadow-indigo-100 overflow-hidden border border-indigo-50">
        
        <table class="w-full">
            
            <thead class="bg-indigo-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Vendor</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Location</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>

            <tbody id="vendor-table-body" class="divide-y divide-gray-200">
                <!-- Populated by JS -->
            </tbody>

        </table>

    </section>

      </section>
</main>

<script src="scripts/pwa.js"></script>
<script type="module" src="./scripts/admin.js"></script>
<script type="module">
  import { initAuthUI, logout } from "./scripts/auth.js";

  initAuthUI();
  lucide.createIcons();
  // Attach logout button
  document.getElementById("logoutBtn")?.addEventListener("click", logout);
</script>
<script type="module" src="./scripts/navbar.js"></script>
</body>
</html>
